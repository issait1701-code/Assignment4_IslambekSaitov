<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 3 — Reserve a table</title>
  <link rel="stylesheet" href="assets/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="container simple-page site-nav" aria-label="Main navigation"><a href="index.html">Home</a></nav>
  <main class="container simple-page pb-4">
    <h1>Reserve a table</h1>
    <p>Fields marked with * are required.</p>
    <form class="panel" action="success.html" method="get">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="name">Your name *</label><input class="form-control" type="text" id="name" name="name" autocomplete="name" required></div>
        <div class="col-md-6"><label class="form-label" for="email">Email *</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div>
        <div class="col-md-6"><label class="form-label" for="phone">Phone *</label><input class="form-control" type="tel" id="phone" name="phone" autocomplete="tel" required></div>
        <div class="col-md-6"><label class="form-label" for="guests">Guests *</label><input class="form-control" type="number" id="guests" name="guests" min="1" step="1" required></div>
        <div class="col-md-6"><label class="form-label" for="date">Date *</label><input class="form-control" type="date" id="date" name="date" required></div>
        <div class="col-md-6"><label class="form-label" for="meal">Meal *</label><select class="form-select" id="meal" name="meal" required><option value="">Choose a meal</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option></select></div>
        <div class="col-12"><fieldset><legend class="fs-6">Seating *</legend>
          <div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="inside" name="seating" value="inside" required><label class="form-check-label" for="inside">Inside</label></div>
          <div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="terrace" name="seating" value="terrace" required><label class="form-check-label" for="terrace">Terrace</label></div>
        </fieldset></div>
        <div class="col-12"><label class="form-label" for="comments">Comments</label><textarea class="form-control" id="comments" name="comments" rows="3"></textarea></div>
        <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="terms" name="terms" value="accepted" required><label class="form-check-label" for="terms">I agree to the terms *</label></div></div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Reserve</button></div>
      </div>
    </form>
  </main>
</body>
</html>
